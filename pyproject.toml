[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frogeindrip-analytics"
version = "1.0.0"
description = "AI-Powered Ecommerce Analytics & Business Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Freelance Analytics Lead" }
]
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pandera>=0.18.0",
    "streamlit>=1.30.0",
    "plotly>=5.15.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "W291"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
